<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="ai-radar-feed" content="./api/feed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Radar">
  <meta name="description" content="AIの新機能・料金・使い方を日本語で。未読の重要ニュースを最大10件、ブックマークと用語学習もできるAI Radar。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./reader.css">
  <title>AI Radar</title>
</head>
<body>
  <main id="app" class="app"><div class="empty" role="status">AI Radarを開いています…</div></main>
  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <button class="nav-item active" data-tab="today" aria-current="page"><img class="ui-icon" src="./icons/house.svg" alt="" aria-hidden="true" width="24" height="24"><span>Today</span></button>
    <button class="nav-item" data-tab="explore"><img class="ui-icon" src="./icons/magnifying-glass.svg" alt="" aria-hidden="true" width="24" height="24"><span>Explore</span></button>
    <button class="nav-item" data-tab="learn"><img class="ui-icon" src="./icons/book-open.svg" alt="" aria-hidden="true" width="24" height="24"><span>Learn</span></button>
    <button class="nav-item" data-tab="settings"><img class="ui-icon" src="./icons/gear-six.svg" alt="" aria-hidden="true" width="24" height="24"><span>Settings</span></button>
  </nav>
  <div class="sheet" id="sheet" aria-hidden="true">
    <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="close" id="closeSheet" aria-label="閉じる"><img class="ui-icon" src="./icons/x.svg" alt="" aria-hidden="true" width="24" height="24"></button>
      <div id="detail"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="empty">AI Radarを使うにはJavaScriptを有効にしてください。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
