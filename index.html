<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="ai-radar-feed" content="./api/feed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Radar">
  <meta name="description" content="AIの大事な更新だけを、日本語で1〜2分。最新ニュースと用語をiPhoneで確認できるAI Radar。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <title>AI Radar</title>
</head>
<body>
  <main id="app" class="app"><div class="empty" role="status">AI Radarを開いています…</div></main>
  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <button class="nav-item active" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg><span>Today</span></button>
    <button class="nav-item" data-tab="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><span>Explore</span></button>
    <button class="nav-item" data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v15M3 4c4-1 6-1 9 1 3-2 5-2 9-1v14c-4-1-6-1-9 2-3-3-5-3-9-2z"/></svg><span>Learn</span></button>
    <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>Settings</span></button>
  </nav>
  <div class="sheet" id="sheet" aria-hidden="true">
    <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="close" id="closeSheet" aria-label="閉じる">×</button>
      <div id="detail"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="empty">AI Radarを使うにはJavaScriptを有効にしてください。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
